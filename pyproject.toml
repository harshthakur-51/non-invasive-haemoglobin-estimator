[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "non-invasive-haemoglobin-estimator"
version = "0.1.0"
description = "Research demo for RGB-feature haemoglobin estimation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hb-estimator = "haemoglobin_estimator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
